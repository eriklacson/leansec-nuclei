# Applies Terraform on every push to main. Authenticates via Workload
# Identity Federation only — no service account key is stored in this repo.
# See ADR-008 in leansec-nuclei for why this repo exists and how it relates
# to the architect's initial local bootstrap apply, which this workflow
# continues (same backend state).
#
# targets.txt and profiles.yaml reach GCS through Terraform, not through a
# separate upload step. The module manages them as
# google_storage_bucket_object.targets/.profiles, sourced from the same two
# files in this repo — so `terraform apply` below is what publishes them.
# An earlier revision also ran `gcloud storage cp` on both files afterwards;
# that was a no-op re-upload and a second writer racing a Terraform-managed
# object, and has been removed.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform init
        run: terraform init

      - name: terraform apply
        run: terraform apply -auto-approve
