# Per-client scan profiles for this GCP deployment.
# Copied from scanner/profiles/profiles.yaml at template creation time.
# Edit this file to customize which profiles run and at what rate for this client.
# Changes take effect on the next `terraform apply` (uploaded to the config bucket).
#
# Fields per profile:
#   tags        — Nuclei template tags to match
#   severity    — findings severity filter
#   csf_subcategory — CSFLite controls this profile satisfies
#   rate_limit  — requests per second
#   concurrency — parallel template threads
#   retries     — per-request retry count
#   timeout     — per-request timeout in seconds
#   input_mode  — "list" (URL list) or "cidr"
#   output      — JSONL output filename for this profile

version: 1
profiles:
  baseline_web:
    tags: [misconfig, headers, cors, ssl, tls, exposure, backup, secret, default-login]
    severity: [medium, high, critical]
    csf_subcategory: [PR.AA-01, PR.DS-01, PR.AA-03, PR.IR-01]
    rate_limit: 3
    concurrency: 2
    retries: 2
    timeout: 5
    input_mode: list
    output: baseline_web.jsonl
    notes: "High-signal posture checks: headers, CORS, TLS config, exposed secrets/backups, default creds."

  identity_remote_access:
    tags: [default-login, auth, admin-panel, exposure]
    severity: [high, critical]
    csf_subcategory: [PR.AA-01, PR.AA-03]
    rate_limit: 3
    concurrency: 2
    retries: 2
    timeout: 5
    input_mode: list
    output: identity_remote_access.jsonl
    notes: "Default creds, weak auth surfaces, exposed admin consoles."

  transport_security:
    tags: [ssl, tls, headers, hsts]
    severity: [info, low, medium, high]
    csf_subcategory: [PR.IR-01]
    rate_limit: 3
    concurrency: 2
    retries: 2
    timeout: 5
    input_mode: list
    output: transport_security.jsonl
    notes: "TLS versions/ciphers, HSTS, secure transport."

  vuln_monitoring:
    tags: [cve]
    severity: [high, critical]
    csf_subcategory: [PR.PS-01]
    rate_limit: 3
    concurrency: 2
    retries: 2
    timeout: 5
    input_mode: list
    output: vuln_monitoring.jsonl
    notes: "Cadence-based CVE monitoring. Primary DE.CM-08 evidence."
