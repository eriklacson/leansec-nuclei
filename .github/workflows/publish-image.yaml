name: Publish Scanner Image

# Build and publish the Nuclei scanner image to GHCR. Three tags per build:
# :latest (main branch HEAD), :<short-sha> (immutable per-commit forensic
# pin), :vX.Y.Z (on Git tag push, semver). Production deployments are
# expected to pin to the semver tag.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - docker/**
      - scanner/**
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: eriklacson/leansec-nuclei

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      # contents:read for checkout; packages:write for GHCR push.
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action computes the three-tag set from the trigger:
      # latest only on main, short-sha on every build, semver only on v*
      # tag push. enable= flags scope each tag to its valid trigger.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      # Build context is the repo root (matches docker/Dockerfile.local's
      # documented behavior). The paths filter on the trigger prevents
      # no-op runs from publishing.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.local
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
