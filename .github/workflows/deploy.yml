name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths: ["deployments/**", "infra/**"]
  pull_request:
    branches: [main]
    paths: ["deployments/**", "infra/**"]

jobs:
  detect-clients:
    runs-on: ubuntu-latest
    outputs:
      clients: ${{ steps.detect.outputs.clients }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          clients=$(ls -d deployments/*/ | xargs -I{} basename {} \
            | grep -v '^_' \
            | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "clients=${clients}" >> $GITHUB_OUTPUT

  deploy:
    needs: detect-clients
    runs-on: ubuntu-latest
    strategy:
      matrix:
        client: ${{ fromJson(needs.detect-clients.outputs.clients) }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    defaults:
      run:
        working-directory: deployments/${{ matrix.client }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.8"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}

      - run: terraform init

      - run: terraform plan -out=tfplan
        if: github.event_name == 'pull_request'

      - run: terraform apply -auto-approve
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
