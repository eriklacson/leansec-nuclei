name: Build Scanner Image

on:
  push:
    branches: [main]
    paths: ["docker/**", "scanner/profiles/**"]

env:
  REGISTRY: asia-southeast1-docker.pkg.dev
  PROJECT: leansecurity-shared
  REPO: nuclei
  IMAGE: scanner

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${REGISTRY}

      - run: |
          docker build -t ${REGISTRY}/${PROJECT}/${REPO}/${IMAGE}:latest \
            -t ${REGISTRY}/${PROJECT}/${REPO}/${IMAGE}:${{ github.sha }} \
            -f docker/Dockerfile docker/
          docker push ${REGISTRY}/${PROJECT}/${REPO}/${IMAGE} --all-tags
