# project.yaml — GCP Cloud Deploy activation
#
# This file specifies the work to be executed by Claude Code to activate the
# GCP Cloud Automated tier of the leansecurity-nuclei pipeline. The file is
# the source of truth for scope, deliverables, constraints, and acceptance.
#
# Companion document: docs/gcp_architecture.md (architecture brief, source
# material for the markdown architecture doc deliverable). Attach the HTML
# brief to Claude Code's working directory when executing this project.

feature: gcp-cloud-deploy
mode: build
version: 1
last_updated: 2026-05-22

# ──────────────────────────────────────────────────────────────────────────────
# Summary
# ──────────────────────────────────────────────────────────────────────────────

summary: |
  Activate the GCP Cloud Automated deployment tier of the leansecurity-nuclei
  pipeline. The Terraform module, container entrypoint, and gated CI workflows
  exist as scaffolding but have never been validated end-to-end. This feature
  rewrites the module to support the public-repo / private-deployments
  topology, publishes the scanner image to GHCR, fixes two known defects,
  ships an architect-driven onboarding runbook, and produces consumer-facing
  documentation for the open-source release.

  LeanSecurity owns no GCP infrastructure. The public repository contains the
  reusable pipeline and module. Per-client deployment configuration lives in
  client-controlled private storage. The architect runs `terraform apply` from
  a workstation. Cloud Scheduler is the autonomous execution loop after
  deployment.

# ──────────────────────────────────────────────────────────────────────────────
# Decisions to confirm before execution
#
# These are Claude's recommended defaults. The architect should confirm or
# override each before Claude Code begins execution. All implementations
# below assume these decisions hold.
# ──────────────────────────────────────────────────────────────────────────────

decisions_to_confirm:

  - id: image_tag_scheme
    decision: |
      Publish three tags per build: `:latest` (main branch HEAD), `:<short-sha>`
      (immutable per-commit), and `:v1.2.3` (on Git tag push, semver).
      Recommended pin for production deployments is the semver tag.
    rationale: |
      All three are zero marginal cost in the same workflow. Each serves a
      distinct purpose: `latest` for experimentation, `sha` for forensic
      pinning, semver for production. Limiting to a subset removes optionality
      without simplifying anything meaningful.

  - id: ghcr_image_name
    decision: ghcr.io/leansecurity/leansec-nuclei
    rationale: |
      Names the artifact by its role (scanner), not the repo (which contains
      more than just the scanner image). Better discoverability for open-source
      consumers searching GHCR for "nuclei scanner."

  - id: bootstrap_delivery
    decision: Executable bash script at scripts/bootstrap-gcp-client.sh
    rationale: |
      Repeatability matters more than visibility. Architects will run this
      multiple times across engagements; a script ensures consistent execution.
      The script is referenced from infra/gcp/README.md and the setup guide.

  - id: existing_scanner_image_workflow
    decision: |
      Delete infra/gcp/workflows/scanner-image.yml entirely. Write
      .github/workflows/publish-image.yaml from scratch — the old workflow
      assumed per-client Artifact Registry destinations which no longer apply.
    rationale: |
      Repurposing a workflow built for a different topology creates more
      complexity than starting clean. The new workflow's logic (single build,
      single push to GHCR) is materially simpler than the old (matrix push to
      N registries).

  - id: ar_mirror_flag
    decision: |
      Variable name `enable_ar_mirror` (default `false`). When true, the
      module provisions a google_artifact_registry_repository in the client
      project. The architect's onboarding then includes a manual step to
      `docker pull` from GHCR and re-tag/push to the client AR before
      `terraform apply` of resources that reference it.
    rationale: |
      Default off because GHCR is the canonical distribution channel and most
      clients won't need a mirror. Opt-in for clients with air-gapped network
      policies or compliance requirements that mandate registry locality.

  - id: seed_document_locked_decisions
    decision: |
      Three new locked design decisions appended to the seed document, in the
      exact wording below. These are added by Claude Code as part of the
      documentation workstream.
    text:
      - "Public-repo, private-deployment topology. The public repository
         contains the reusable pipeline and module. Per-client deployment
         configuration lives in client-controlled storage outside the public
         repository."
      - "GHCR is the scanner image distribution channel. The image is built
         from the public repository and published to
         ghcr.io/leansecurity/leansec-nuclei. Clients pull from GHCR directly
         or mirror into their own Artifact Registry."
      - "Cloud-side execution is architect-driven, not CI-driven. terraform
         apply runs from the architect's workstation against the client GCP
         project. Public-repo CI does not hold GCP credentials and never
         touches client infrastructure."

# ──────────────────────────────────────────────────────────────────────────────
# Feature-wide constraints
#
# These apply to every workstream. Violations are blockers.
# ──────────────────────────────────────────────────────────────────────────────

constraints:

  - id: no_client_artifacts_in_repo
    rule: |
      No file in this repository may contain client-identifying data: client
      names, GCP project IDs, target lists, internal IP ranges, or any
      configuration specific to a paying engagement. `deployments/_example/`
      is the only deployment-shaped folder permitted; it must use placeholder
      values throughout.

  - id: scanner_layer_unchanged
    rule: |
      No changes to scanner/scan.py, scanner/nuclei_helpers.py, or tests/ are
      permitted EXCEPT for the profile-name drift fix described in build.B2.
      The scanner layer's Python runtime, internal API, and YAML parsing
      surface are out of scope.

  - id: progressive_deployment_pattern
    rule: |
      The local CLI mode (scanner/scan.py + targets.txt) must continue to
      work unchanged throughout this feature. Validate before committing any
      change to docker/ or infra/ that `poetry run python scanner/scan.py
      <client>` still produces JSONL in results/<client>/YYYY-MM/.

  - id: container_entrypoint_stays_bash
    rule: |
      docker/entrypoint.sh remains bash. It does not gain a Python dependency,
      does not invoke scan.py, does not parse YAML. Profile-flag changes are
      hardcoded in the entrypoint to match profiles.yaml names.

  - id: terraform_module_parameterized
    rule: |
      infra/gcp/ never hardcodes client names, GCP project IDs, region values,
      bucket names, or image paths. Everything that varies per deployment
      comes through variables. Defaults may be set for region (asia-southeast1)
      and schedule, but never for identity-bearing values.

  - id: code_ready_scope
    rule: |
      Claude Code's scope ends at PR-ready code. Acceptance items marked
      `verified_by: architect` require manual execution against a real GCP
      project and are NOT to be attempted by Claude Code. Claude Code may
      write helper scripts to assist architect verification but does not run
      them against cloud infrastructure.

# ──────────────────────────────────────────────────────────────────────────────
# Workstreams
#
# Three workstreams with explicit dependencies. Sequential execution.
# ──────────────────────────────────────────────────────────────────────────────

workstreams:

  # ════════════════════════════════════════════════════════════════════════
  # B. Build
  # ════════════════════════════════════════════════════════════════════════

  - id: build
    title: Implementation
    depends_on: []
    description: |
      All code changes required to deliver the feature. Splits into defect
      fixes, Terraform module rewrite, container entrypoint updates, CI/CD
      workflow changes, bootstrap script, and _example/ updates.

    deliverables:

      - id: B1
        title: Fix Terraform env block formatting
        scope: |
          The current infra/gcp/main.tf has malformed env blocks on the
          google_cloud_run_v2_job resource. The RESULTS_BUCKET env value
          appears truncated. Rewrite each env entry as a properly-formatted
          multi-line block per the google_cloud_run_v2_job v6+ provider
          schema.
        files:
          - infra/gcp/main.tf
        acceptance:
          - "`terraform validate` passes on infra/gcp/ with no syntax errors"
          - "`terraform fmt -check` passes"
          - "Each env entry on the Cloud Run job resource is a separate, complete env { name; value } block"

      - id: B2
        title: Fix profiles.yaml ↔ entrypoint.sh drift
        scope: |
          The container entrypoint writes JSONL files with names that do not
          match the profile names in profiles.yaml. Update entrypoint.sh so
          every nuclei invocation writes a file named `<profile>_YYYY-MM.jsonl`
          where `<profile>` is the exact key from profiles.yaml.
          Current drift: identity_*.jsonl vs identity_remote_access;
          transport_*.jsonl vs transport_security; owasp_top10_*.jsonl vs
          owasp_top10_core.
        files:
          - docker/entrypoint.sh
          - scanner/profiles/profiles.yaml  # verify keys, do not modify
        acceptance:
          - "Every profile key in profiles.yaml has a matching nuclei invocation in entrypoint.sh"
          - "Every JSONL filename written by entrypoint.sh matches a profile key exactly"
          - "Local Docker mode (docker/Dockerfile.local + entrypoint.sh) produces JSONL with the corrected filenames"
          - "Filenames match what scanner/scan.py produces in local CLI mode"

      - id: B3
        title: Rewrite infra/gcp/ Terraform module
        scope: |
          Restructure the module to support the open-source operating model.
          Add three variables behind `count`-based conditional resource
          provisioning. Make the scanner_image variable accept arbitrary URIs
          (GHCR by default, AR mirror optional). Remove implicit assumption of
          a specific Artifact Registry path. Preserve all required-variable
          interface contracts from the seed document.
        files:
          - infra/gcp/main.tf
          - infra/gcp/variables.tf
          - infra/gcp/outputs.tf
          - infra/gcp/versions.tf  # create if absent
        new_variables:
          - name: enable_scheduler
            type: bool
            default: true
            description: "Provision Cloud Scheduler job + scheduler SA + invoker IAM binding"
          - name: enable_wif
            type: bool
            default: false
            description: "Provision Workload Identity Federation pool, provider, and SA binding for external CI access"
          - name: enable_ar_mirror
            type: bool
            default: false
            description: "Provision a google_artifact_registry_repository in this client project for mirroring the GHCR image"
        scanner_image_default: ghcr.io/leansecurity/leansec-nuclei:latest  # placeholder; production deployments must pin
        preserved_interface:
          - "Required variables: project_id, client_name, scanner_image, targets_file"
          - "Outputs: config_bucket_name, results_bucket_name, cloud_run_job_name, scheduler_job_name (null when scheduler disabled), scanner_service_account_email"
        acceptance:
          - "`terraform validate` passes"
          - "`terraform fmt -check` passes"
          - "Default plan (no flags overridden) produces buckets, Cloud Run job, scheduler, SAs, IAM bindings — but no AR repository and no WIF resources"
          - "Plan with enable_scheduler=false omits scheduler resources and IAM bindings"
          - "Plan with enable_wif=true adds WIF pool, provider, and SA binding"
          - "Plan with enable_ar_mirror=true adds a google_artifact_registry_repository resource"
          - "scanner_image variable accepts any string URI; no validation forcing a specific registry path"

      - id: B4
        title: Delete infra/gcp/workflows/deploy.yml
        scope: |
          The matrix-per-client deploy workflow is incompatible with the
          public-repo / private-deployments topology. There is no per-client
          deployment in the public repo for it to iterate. Delete the file.
        files:
          - infra/gcp/workflows/deploy.yml  # to be deleted
        acceptance:
          - "File does not exist in the working tree"

      - id: B5
        title: Replace scanner-image.yml with publish-image.yaml
        scope: |
          Delete the old workflow (per decision in
          decisions_to_confirm.existing_scanner_image_workflow). Write a new
          workflow at .github/workflows/publish-image.yaml that builds the
          scanner image and pushes to GHCR with three tags per build.
        files:
          - infra/gcp/workflows/scanner-image.yml  # to be deleted
          - .github/workflows/publish-image.yaml  # new
        triggers:
          - "push to main, paths: docker/**, scanner/**"
          - "push of tag v*"
        tags_per_build:
          - ":latest on main branch builds"
          - ":<short-sha> every build"
          - ":v1.2.3 on tag push only, derived from the tag name"
        auth: "GITHUB_TOKEN (built-in, no secret registration required)"
        acceptance:
          - "publish-image.yaml exists and passes actionlint"
          - "Workflow uses docker/login-action with ghcr.io and GITHUB_TOKEN"
          - "Workflow uses docker/build-push-action with the three-tag scheme"
          - "Old scanner-image.yml does not exist in the working tree"
          - "Workflow syntax-validates locally via actionlint"
          - verified_by: architect
            check: "First successful push to ghcr.io/leansecurity/leansec-nuclei from a real CI run"

      - id: B6
        title: Write scripts/bootstrap-gcp-client.sh
        scope: |
          Bash script that performs the manual bootstrap steps (1-4 of
          per-client onboarding in the architecture brief): enable required
          APIs in the target GCP project, create the Terraform state bucket,
          and document the IAM grant the architect needs from the client.
          Idempotent — safe to re-run.
        files:
          - scripts/bootstrap-gcp-client.sh
        script_contract:
          inputs:
            - "Positional arg 1: GCP project ID (required)"
            - "Positional arg 2: GCS region for state bucket (optional, default asia-southeast1)"
            - "Positional arg 3: state bucket name (optional, default ${project_id}-tfstate-leansecurity-nuclei)"
          behavior:
            - "Set active gcloud project to arg 1"
            - "Enable required APIs (run, storage, iam — and conditionally cloudscheduler, iamcredentials, sts, artifactregistry based on flags)"
            - "Create GCS state bucket if absent, with versioning enabled"
            - "Print the IAM roles the architect needs the client admin to grant"
            - "Print next steps (clone _example, populate tfvars, run terraform init)"
          exit_codes:
            - "0 on success or no-op"
            - "Non-zero on gcloud failure with clear error context"
        constraints:
          - "Bash 4+ compatible (no zsh-isms)"
          - "Set -euo pipefail at top"
          - "shellcheck passes with no errors"
          - "No client-identifying defaults"
        acceptance:
          - "Script exists and is executable (chmod +x)"
          - "shellcheck scripts/bootstrap-gcp-client.sh passes"
          - "Running with no args prints usage and exits non-zero"
          - "Running with --help prints usage and exits 0"
          - "Script header comment documents purpose, inputs, prerequisites"
          - verified_by: architect
            check: "Script executes cleanly against a fresh GCP test project, enables APIs, and creates a working state bucket"

      - id: B7
        title: Update deployments/_example/
        scope: |
          Refresh the example deployment folder to reflect the new module
          shape (GHCR image path, new flags, source ref to the public module).
          This is documentation-by-example for open-source consumers, not a
          live deployment.
        files:
          - deployments/_example/main.tf
          - deployments/_example/terraform.tfvars
          - deployments/_example/backend.tf
          - deployments/_example/targets.txt
          - deployments/_example/README.md  # create if absent
        content_requirements:
          - "main.tf references the module via a Git source ref: source = \"git::https://github.com/leansecurity/leansecurity-nuclei.git//infra/gcp?ref=v1.0.0\""
          - "scanner_image in tfvars pins to a semver tag (use v1.0.0 as placeholder)"
          - "All values that would identify a real client use the placeholder <client> or example.com"
          - "README.md in _example/ explains: this is a template, copy to your private storage, do not deploy from this folder directly"
        acceptance:
          - "No file contains client-identifying data"
          - "main.tf passes terraform validate when copied to a fresh directory and terraform init is run"
          - "README.md explicitly states the folder is a template not a deployment"

      - id: B8
        title: Remove deployments/mdi/ placeholder
        scope: |
          The deployments/mdi/ folder is a placeholder that contradicts the
          public-repo topology (and is gitignored, which contradicts the CI
          auto-discovery model). Remove it from the repo. The corresponding
          .gitignore entry should also be removed.
        files:
          - deployments/mdi/  # to be deleted
          - .gitignore  # remove the deployments/mdi/ line
        acceptance:
          - "deployments/mdi/ does not exist in the working tree"
          - "No entry referencing deployments/mdi in .gitignore"
          - "`git status` is clean after the removal commit"

    workstream_acceptance:
      - "All deliverables B1-B8 acceptance criteria pass"
      - "`poetry run black --check . && poetry run ruff check . && poetry run bandit -r . --severity-level high && poetry run pytest` passes"
      - "`terraform validate` and `terraform fmt -check` pass on infra/gcp/"
      - "`actionlint .github/workflows/*.yaml` passes"
      - "`shellcheck` passes on all bash scripts in scripts/ and docker/"
      - "Local CLI mode (poetry run python scanner/scan.py <client>) still produces correctly-named JSONL files"
      - "Local Docker mode (docker run with CLOUD_PROVIDER=local) still produces correctly-named JSONL files"

  # ════════════════════════════════════════════════════════════════════════
  # D. Documentation
  # ════════════════════════════════════════════════════════════════════════

  - id: documentation
    title: Documentation
    depends_on: [build]
    description: |
      Documentation deliverables for the open-source release. Written for
      the open-source consumer (not LeanSecurity-internal). All docs reflect
      the actual final shape of the implementation produced in the build
      workstream — not predicted shape.

    deliverables:

      - id: D1
        title: Update root README.md
        scope: |
          Remove the "not yet available" framing from the cloud-deployment
          section. Document the public-repo / private-deployments topology
          briefly. Add cross-links to the architecture doc, setup guide, and
          module README. Preserve existing local CLI and Docker mode
          documentation.
        files:
          - README.md
        required_sections:
          - "Cloud-automated mode section (replaces the 'not yet available' notice)"
          - "Operating model paragraph: public repo, private deployments, architect-driven"
          - "Links: → docs/setup-guide.md, → docs/gcp_architecture.md, → infra/gcp/README.md"
          - "Image distribution note: ghcr.io/leansecurity/leansec-nuclei"
        constraints:
          - "Existing local CLI documentation preserved unchanged"
          - "No client-identifying examples; all examples use <your-client> or example.com"
          - "Cloud-mode section is concise — links out to detailed docs rather than duplicating them"
        acceptance:
          - "README.md no longer contains the phrase 'not yet available' in any cloud context"
          - "All four cross-links (setup-guide, gcp_architecture, infra/gcp/README, GHCR) resolve to existing files or valid URLs"
          - "Reading README.md alone, an open-source consumer understands what cloud mode does and where to go next"

      - id: D2
        title: Write infra/gcp/README.md (module reference)
        scope: |
          Module-level reference documentation. Reads like Terraform Registry
          module docs: purpose, required variables, optional variables,
          outputs, examples, prerequisites. Brief mention of the bootstrap
          script with a link to its location.
        files:
          - infra/gcp/README.md
        required_sections:
          - "Purpose (one paragraph)"
          - "Prerequisites (gcloud auth, IAM, bootstrap script)"
          - "Required variables (with type, description)"
          - "Optional variables (enable_scheduler, enable_wif, enable_ar_mirror, region, schedule)"
          - "Outputs"
          - "Example usage (calling the module from a private deployment folder)"
          - "Flag semantics: when to enable WIF, when to enable AR mirror, etc."
        constraints:
          - "Variable tables match the actual variables.tf produced in B3"
          - "Output tables match the actual outputs.tf produced in B3"
          - "All examples use placeholder values"
        acceptance:
          - "Every variable in variables.tf has a row in the README variable table"
          - "Every output in outputs.tf has a row in the README output table"
          - "Example main.tf in the README is copy-pasteable into a private deployment folder and parses cleanly"

      - id: D3
        title: Write docs/gcp_architecture.md
        scope: |
          Distill the GCP cloud deploy architecture brief (provided as an
          attached HTML file) into a permanent markdown document in the repo.
          Convert SVG diagrams to mermaid where feasible, otherwise reference
          the source brief. Strip sections that are open-question or
          decision-pending (the brief's §10 has no place in a settled doc).
          Add a "see also" footer linking to README, module reference, and
          setup guide.
        files:
          - docs/gcp_architecture.md
        source: "gcp-cloud-deploy-brief.html (architect provides as input artifact)"
        required_sections:
          - "Context and intent"
          - "Operating model — public repo, private deployments"
          - "Runtime scan execution flow"
          - "Module flags (enable_scheduler, enable_wif, enable_ar_mirror)"
          - "Public repo CI/CD model"
          - "Per-client onboarding workflow"
          - "See also (cross-links)"
        sections_to_omit:
          - "Brief's §7 (known defects — fixed in this feature, no longer relevant to the canonical doc)"
          - "Brief's §8 (scope boundary — feature-specific, not a permanent reference)"
          - "Brief's §9 (acceptance criteria — feature-specific)"
          - "Brief's §10 (open decisions — resolved by the time this is written)"
        constraints:
          - "Diagrams converted to mermaid where the diagram is structurally simple"
          - "Where mermaid cannot represent the diagram, embed the SVG inline"
          - "No reference to LeanSecurity-internal concepts (Conduit references stay because Conduit is mentioned in the open-source seed document as the downstream consumer; this is public information)"
        acceptance:
          - "Document renders correctly on GitHub's markdown viewer"
          - "All cross-links resolve"
          - "Diagrams visible and legible"
          - "No mention of open questions, scope decisions, or implementation TODOs"

    workstream_acceptance:
      - "All deliverables D1-D3 acceptance criteria pass"
      - "Every file referenced by every doc exists in the repo (no dead links)"
      - "Documentation reflects the actual implementation from the build workstream — no predicted-shape drift"

  # ════════════════════════════════════════════════════════════════════════
  # S. Setup Guide
  # ════════════════════════════════════════════════════════════════════════

  - id: setup-guide
    title: Setup Guide
    depends_on: [build, documentation]
    description: |
      End-to-end setup guide for an open-source consumer who wants to deploy
      the pipeline to their own GCP project. The "happy path" version of the
      onboarding workflow — written for someone executing the steps, not
      reviewing architecture. Excludes LeanSecurity-internal operational
      details.

    deliverables:

      - id: S1
        title: Write docs/setup-guide.md
        scope: |
          Step-by-step setup guide. Covers prerequisites, GCP project bootstrap,
          private deployment folder creation, Terraform init/plan/apply, first
          scan validation, and ongoing operations (changing targets, bumping
          scanner version). Written for a competent infrastructure engineer
          who has gcloud and terraform installed but is new to this pipeline.
        files:
          - docs/setup-guide.md
        required_sections:
          - "Prerequisites (gcloud, terraform, GCP project, IAM)"
          - "Step 1: Bootstrap the GCP project (run scripts/bootstrap-gcp-client.sh)"
          - "Step 2: Set up your private deployment folder (copy from _example/)"
          - "Step 3: Configure tfvars (project_id, client_name, targets_file, scanner_image pin)"
          - "Step 4: Configure backend.tf (point at the state bucket from step 1)"
          - "Step 5: Populate targets.txt"
          - "Step 6: terraform init"
          - "Step 7: terraform plan, review"
          - "Step 8: terraform apply"
          - "Step 9: Trigger first scan manually (gcloud run jobs execute)"
          - "Step 10: Verify JSONL output in the results bucket"
          - "Step 11: Confirm Cloud Scheduler shows next execution time"
          - "Ongoing operations (changing targets, bumping image version, disabling scheduler)"
          - "Troubleshooting (common errors and fixes)"
        audience: |
          Open-source consumer — anyone using this pipeline, not specifically
          LeanSecurity. No LeanSecurity-internal references (no mention of
          specific client storage solutions, billing arrangements, or internal
          conventions). The reader's "private storage" is their own concern;
          the guide stays neutral on whether it's a private git repo, an
          encrypted drive, or a GCS bucket.
        constraints:
          - "Every command shown is copy-pasteable with placeholder substitution"
          - "Every placeholder uses angle-bracket convention: <your-project-id>, <your-client-name>, etc."
          - "Every step includes an expected-output snippet so the reader can verify success"
          - "Troubleshooting section covers at least: API not enabled, IAM permission denied, terraform state bucket access denied, scanner image pull failure, Cloud Run job timeout"
          - "No assumption that the reader is LeanSecurity-affiliated"
        acceptance:
          - "Document renders correctly on GitHub's markdown viewer"
          - "All commands use placeholders; no real values"
          - "Every step is independently verifiable (expected output shown)"
          - "Troubleshooting section addresses the five required failure modes"
          - "References to other docs (README, gcp_architecture.md, module README) resolve"
          - verified_by: architect
            check: "Following the setup guide end-to-end against a fresh test GCP project produces a working deployment with no out-of-doc steps required"

    workstream_acceptance:
      - "S1 acceptance criteria pass"
      - "Setup guide cross-references existing docs and scripts correctly"
      - "No LeanSecurity-internal information leaks into the guide"

# ──────────────────────────────────────────────────────────────────────────────
# Out of scope
# ──────────────────────────────────────────────────────────────────────────────

out_of_scope:
  - "Onboarding any real paying client. First-client onboarding is a separate task that consumes this feature's deliverables."
  - "AWS or Azure infrastructure modules. They remain stubbed."
  - "Changes to scanner/scan.py, scanner/nuclei_helpers.py, profiles.yaml schema, or tests/ — beyond the profile-name drift fix in B2."
  - "Cloud-side validation against a real client GCP project. Validation runs against a LeanSecurity-owned test project only, and is architect-verified, not Claude-verified."
  - "Conduit ingestion validation. The GCS bucket contract is verified by the acceptance checklist; Conduit-side reading is its own project."
  - "Tooling to sync per-client deployment folders between private storage and the architect workstation."
  - "A LeanSecurity-internal operations runbook covering client storage conventions, billing, engagement lifecycle. This lives in private documentation."
  - "SLO tracking component, web UI, or any future component. Spec mode, not build mode — separate project.yaml when scoped."

# ──────────────────────────────────────────────────────────────────────────────
# Sequencing
# ──────────────────────────────────────────────────────────────────────────────

sequencing:
  rule: "Workstreams execute sequentially. Each workstream's deliverables must pass workstream_acceptance before the next workstream begins."
  order:
    - build
    - documentation
    - setup-guide
  rationale: |
    Documentation must reflect the actual final shape of the implementation,
    not a predicted shape. The setup guide must reference real working code
    and real working docs. Reversing the order produces drift before merge.

# ──────────────────────────────────────────────────────────────────────────────
# Verification demarcation
# ──────────────────────────────────────────────────────────────────────────────

verification:
  claude_code_verified: |
    All acceptance criteria not marked `verified_by: architect`. These can
    be validated locally without cloud credentials: terraform validate,
    terraform fmt, shellcheck, actionlint, pytest, file existence checks,
    content checks, local CLI and Docker mode dry runs.

  architect_verified: |
    Acceptance criteria marked `verified_by: architect` require real GCP
    credentials and execution against a test project. Claude Code prepares
    the code that makes verification possible; the architect runs the cloud
    steps. Specifically:
      - B5: first successful image push to GHCR from a real CI run
      - B6: bootstrap script execution against a real GCP project
      - S1: end-to-end setup guide walkthrough against a fresh test project
      - Brief §9 items 4-13: full cloud-side acceptance checklist

# ──────────────────────────────────────────────────────────────────────────────
# Inputs Claude Code requires
# ──────────────────────────────────────────────────────────────────────────────

inputs:
  - path: gcp-cloud-deploy-brief.html
    purpose: "Source material for D3 (docs/gcp_architecture.md)"
    required: true
    notes: "Architect must place this file in Claude Code's working directory before execution. The brief is the canonical source for the architecture markdown deliverable."

  - path: project repository (current state)
    purpose: "All file modifications happen here"
    required: true

# ──────────────────────────────────────────────────────────────────────────────
# Deliverable summary (flat list for review)
# ──────────────────────────────────────────────────────────────────────────────

deliverable_summary:
  build:
    - "infra/gcp/main.tf (env block fix, module rewrite for flags)"
    - "infra/gcp/variables.tf (new variables)"
    - "infra/gcp/outputs.tf (preserved interface)"
    - "infra/gcp/versions.tf (provider pinning, create if absent)"
    - "docker/entrypoint.sh (profile name alignment)"
    - "infra/gcp/workflows/deploy.yml (DELETE)"
    - "infra/gcp/workflows/scanner-image.yml (DELETE)"
    - ".github/workflows/publish-image.yaml (NEW)"
    - "scripts/bootstrap-gcp-client.sh (NEW)"
    - "deployments/_example/* (refresh)"
    - "deployments/_example/README.md (NEW)"
    - "deployments/mdi/ (DELETE)"
    - ".gitignore (remove mdi line)"
  documentation:
    - "README.md (cloud section rewrite + cross-links)"
    - "infra/gcp/README.md (module reference, NEW)"
    - "docs/gcp_architecture.md (architecture distillation, NEW)"
  setup-guide:
    - "docs/setup-guide.md (end-to-end open-source setup, NEW)"
