      scope: |
        Rewrite docker/Dockerfile (cloud) on the same python:3.12-slim base
        with cloud CLIs layered in. Fix infra/gcp/workflows/scanner-image.yml
        build context. Run cloud E2E validation against a test client on
        Cloud Run.
      blocked_by: This PR landing and stabilizing.

  - seed-document-v1.2-revision:
      scope: |
        Fold the seed-document-v1.2-delta drafted separately into the next
        seed document revision. Updates §10 Locked Design Decisions, the
        Runtime Language Policy section, the Component Registry, and §12
        Change Log. Per system instruction, the seed document is not
        re-drafted piecemeal — this revision waits for the SLO tracking
        component scope.
      blocked_by: SLO tracking component (vmctl) scope finalization.
